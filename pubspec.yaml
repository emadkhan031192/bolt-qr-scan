name: boltscan
description: "Bolt QR Scan and Generator - a lightning-fast, fully offline QR and barcode scanner + QR generator."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State
  flutter_riverpod: 3.4.3

  # Scanner (bundled ML Kit, works offline)
  mobile_scanner: 7.4.2

  # QR generation
  qr_flutter: 4.1.0

  # Sharing / launching
  share_plus: 13.3.1
  url_launcher: 6.3.3
  android_intent_plus: 6.1.0

  # Storage
  sqflite: 2.4.4+1
  shared_preferences: 2.5.6
  path_provider: 2.1.6

  # Device
  vibration: 3.2.1
  permission_handler: 13.0.2
  image_picker: 1.2.4
  gal: 2.3.3
  file_picker: 13.1.0

  # Utils
  csv: 8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
